<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Emerald Primary -->
    <linearGradient id="fmsEmeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="fmsBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Depth Shadow for Cross -->
    <filter id="fmsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="108" 
    fill="url(#fmsEmeraldGrad)" 
  />

  <!-- Subtle Specular Inner Rim -->
  <rect 
    x="34" 
    y="34" 
    width="444" 
    height="444" 
    rx="106" 
    fill="none" 
    stroke="url(#fmsBorderGrad)" 
    stroke-width="4" 
  />

  <!-- Medical Cross Symbol (HIMS &bull; FMS Core) -->
  <g filter="url(#fmsShadow)">
    <!-- Vertical Arm -->
    <rect 
      x="212" 
      y="116" 
      width="88" 
      height="280" 
      rx="24" 
      fill="#ffffff" 
    />
    <!-- Horizontal Arm -->
    <rect 
      x="116" 
      y="212" 
      width="280" 
      height="88" 
      rx="24" 
      fill="#ffffff" 
    />
  </g>
</svg>
