providers = ['php', 'node']

[phases.setup]
nixPkgs = [
  'nodejs_20'
]

[phases.install]
cmds = [
  'composer install --ignore-platform-reqs --no-dev --optimize-autoloader',
  'npm ci || npm install'
]

[phases.build]
cmds = [
  'npm run build'
]

[start]
cmd = 'php artisan optimize:clear && (php artisan migrate --force || true) && (php artisan config:cache || true) && (php artisan route:cache || true) && (php artisan view:cache || true) && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
